name: MYTHOS keyless skill quality audit
on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'scripts/mythos-skill-audit.sh'
      - '.github/workflows/mythos-skill-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SkillEvaluator (no LLM provider extras)
        run: python -m pip install 'skillevaluator==0.9.0'
      - name: Evaluate nine repo-native skills (keyless quality only)
        run: bash scripts/mythos-skill-audit.sh
      - name: Preserve evaluation artifacts even when HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythos-skill-quality
          path: reports/mythos-skill-audit/
          if-no-files-found: warn
